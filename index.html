<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matías Rosello · Portfolio</title>
    <meta name="description" content="Portfolio de Matías Rosello: desarrollador de software asistido por IA, sistemas GIS y geoespaciales. Resistencia, Chaco, Argentina." />
    <meta name="theme-color" content="#060a10" />
    <meta property="og:title" content="Matías Rosello · Portfolio" />
    <meta property="og:description" content="Desarrollador de software asistido por IA · GIS y sistemas geoespaciales" />
    <meta property="og:image" content="img/sig-vial.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23ffc46b'/%3E%3Cellipse cx='32' cy='32' rx='29' ry='10' fill='none' stroke='%234fc3f7' stroke-width='3' transform='rotate(-20 32 32)'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="labels" class="labels"></div>

    <header class="topbar">
      <a class="brand" href="#" data-action="home" aria-label="Inicio">
        <span class="brand__dot"></span>
        <span class="brand__name">Matías Rosello</span>
      </a>
      <nav class="topbar__nav">
        <button class="btn-ghost" data-action="about" data-i18n="nav.about">Sobre mí</button>
        <button class="btn-ghost" data-action="list" data-i18n="nav.list">Lista</button>
        <a class="btn-ghost" href="https://github.com/rikochet87" target="_blank" rel="noopener">GitHub</a>
        <button class="btn-lang" data-action="lang" aria-label="Cambiar idioma / Change language">EN</button>
      </nav>
    </header>

    <section class="hero" id="hero">
      <p class="hero__kicker" data-i18n="hero.kicker">Resistencia, Chaco · Argentina</p>
      <h1 class="hero__title">Matías Rosello</h1>
      <p class="hero__role" data-i18n="hero.role">Desarrollador de software asistido por IA · GIS y sistemas geoespaciales</p>
      <p class="hero__hint" data-i18n="hero.hint">Cada cerro es un proyecto. Hacé click para explorarlo.</p>
    </section>

    <div class="hud" id="hud" aria-hidden="true">
      <div class="hud__north" id="hud-north"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l5 14-5-3-5 3z" fill="currentColor"/><text x="12" y="23" text-anchor="middle" font-size="6" fill="currentColor">N</text></svg></div>
      <div class="hud__scale"><span id="hud-scale-bar"></span><b id="hud-scale-label">1 km</b></div>
      <div class="hud__coords" id="hud-coords">POSGAR 2007 · Faja 5</div>
    </div>

    <div class="filters" id="filters" role="toolbar" aria-label="Filtrar proyectos"></div>

    <aside class="panel" id="panel" aria-hidden="true" role="dialog" aria-modal="false" aria-labelledby="panel-title">
      <button class="panel__close" data-action="close" aria-label="Cerrar">&times;</button>
      <div class="panel__nav">
        <button class="panel__arrow" data-action="prev" aria-label="Anterior">&#8592;</button>
        <span class="panel__count" id="panel-count"></span>
        <button class="panel__arrow" data-action="next" aria-label="Siguiente">&#8594;</button>
      </div>
      <div class="panel__body" id="panel-body"></div>
    </aside>

    <div class="overlay" id="about" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="overlay__card overlay__card--about">
        <button class="panel__close" data-action="close-overlay" aria-label="Cerrar">&times;</button>
        <div id="about-body"></div>
      </div>
    </div>

    <div class="overlay" id="list" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="overlay__card overlay__card--list">
        <button class="panel__close" data-action="close-overlay" aria-label="Cerrar">&times;</button>
        <h2 class="overlay__title" data-i18n="list.title">Todos los proyectos</h2>
        <div class="grid" id="list-grid"></div>
      </div>
    </div>

    <div class="loader" id="loader"><span></span></div>
    <noscript><p class="noscript">Este sitio necesita JavaScript. Mis proyectos: <a href="https://github.com/rikochet87">github.com/rikochet87</a></p></noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
